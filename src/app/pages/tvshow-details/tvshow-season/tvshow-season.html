<div class="accordion__card">
    <div class="card-header" id="heading-{{ season.season_number }}">
        <button type="button" data-toggle="collapse" [attr.data-target]="'#collapse-' + season.season_number" aria-expanded="true" [attr.aria-controls]="'collapse-' + season.season_number">
            <span>Season: {{ season.season_number }}</span>
            <span>{{ season.episode_count }} Episodes ({{ season.air_date | formatDate: 'full'}})</span>
        </button>
    </div>

    <div id="collapse-{{ season.season_number }}" class="collapse" [attr.aria-labelledby]="'heading-' + season.season_number" data-parent="#accordion">
        <div class="card-body">
            <table class="accordion__list">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Title</th>
                        <th>Air Date</th>
                    </tr>
                </thead>
                
                <tbody>
                    @if(season.episode_count > 0){
                        @if(!fetchingEpisodes){
                            @for (episode of episodes; track episode.id) {
                            <tr>
                                <th>{{ episode.episode_number }}</th>
                                <td>{{ episode.overview }}</td>
                                <td>{{ episode.air_date | formatDate: 'full'}}</td>
                            </tr>
                            }
                        }@else {
                            <tr>
                                <td colspan="3" style="text-align: center;">Loading...</td>
                            </tr>
                        }
                    }@else {
                        <tr>
                            <td colspan="3" style="text-align: center;">No episodes yet!!!</td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
