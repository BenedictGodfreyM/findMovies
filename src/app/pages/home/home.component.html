<section class="content" style="margin-top: 100px;">
    <div class="content__head">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <!-- content title -->
                    <h2 class="content__title">Popular Items</h2>
                    <!-- end content title -->

                    <!-- content tabs nav -->
                    <ul class="nav nav-tabs content__tabs" id="content__tabs" role="tablist">
                        <li class="nav-item">
                            <a class="nav-link active" data-toggle="tab" href="#tab-1" role="tab" aria-controls="tab-1" aria-selected="true">MOVIES</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" data-toggle="tab" href="#tab-2" role="tab" aria-controls="tab-2" aria-selected="false">TV SERIES</a>
                        </li>
                    </ul>
                    <!-- end content tabs nav -->

                    <!-- content mobile tabs nav -->
                    <div class="content__mobile-tabs" id="content__mobile-tabs">
                        <div class="content__mobile-tabs-btn dropdown-toggle" role="navigation" id="mobile-tabs" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <input type="button" value="Movies">
                            <span></span>
                        </div>

                        <div class="content__mobile-tabs-menu dropdown-menu" aria-labelledby="mobile-tabs">
                            <ul class="nav nav-tabs" role="tablist">
                                <li class="nav-item"><a class="nav-link active" id="1-tab" data-toggle="tab" href="#tab-1" role="tab" aria-controls="tab-1" aria-selected="true">MOVIES</a></li>

                                <li class="nav-item"><a class="nav-link" id="2-tab" data-toggle="tab" href="#tab-2" role="tab" aria-controls="tab-2" aria-selected="false">TV SERIES</a></li>
                            </ul>
                        </div>
                    </div>
                    <!-- end content mobile tabs nav -->
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- content tabs -->
        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="tab-1" role="tabpanel" aria-labelledby="1-tab">
                <div class="row">
                    @if(trending_movies.results){
                        @for(item of trending_movies.results; track item.id ){
                        <div class="col-6 col-sm-4 col-lg-3 col-xl-2">
                            <media-card [media]="item" [isCarouselCard]="false"></media-card>
                        </div>
                        } @empty {
                        <div class="col-12">
                            <div class="card">
                                <div class="card__content">
                                    <h3 class="card__title">No Media</h3>
                                </div>
                            </div>
                        </div>
                        }
                    }
                </div>
            </div>

            <div class="tab-pane fade" id="tab-2" role="tabpanel" aria-labelledby="2-tab">
                <div class="row">
                    @if(trending_series.results){
                        @for(item of trending_series.results; track item.id ){
                        <div class="col-6 col-sm-4 col-lg-3 col-xl-2">
                            <media-card [media]="item" [isCarouselCard]="false"></media-card>
                        </div>
                        } @empty {
                        <div class="col-12">
                            <div class="card">
                                <div class="card__content">
                                    <h3 class="card__title">No Media</h3>
                                </div>
                            </div>
                        </div> 
                        }
                    }
                </div>
            </div>
        </div>
        <!-- end content tabs -->
    </div>
</section>
