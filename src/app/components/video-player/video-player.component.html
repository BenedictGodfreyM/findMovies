@if(loadingVideo){
<app-skeleton-loader class="circle" width="50px" height="200px"></app-skeleton-loader>
}@else {
<div style="position: relative;padding-top: 25px;padding-bottom: 56.25%;height: 0;" *ngIf="videoFound">
    <iframe width="560" height="315" [src]="video_URL | safe" style="position: absolute;top: 0;left: 0;width: 100%;height: 100%;" *ngIf="videoFound" allowfullscreen></iframe>
</div>
}
